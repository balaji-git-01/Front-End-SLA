<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function Message() {
        return new Promise((resolve) => {
          setTimeout(() => {
            resolve("Message received after 2 seconds");
          }, 2000);
        });
      }

      async function showMessage() {
        const result = await Message();
        console.log(result);
      }

      showMessage();
    </script>
  </body>
</html>
