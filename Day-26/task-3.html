<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
  <p id="para">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Distinctio, consectetur numquam. Provident, blanditiis fugiat? Assumenda pariatur velit autem, temporibus aut voluptate. Voluptatem dolor atque similique quis dolores dolorum sed perferendis..</p>

  <button onclick="hidePara()">Hide</button>
  <button onclick="showPara()">Show</button>

  <script>
    function hidePara() {
      document.getElementById("para").style.display = "none";
    }

    function showPara() {
      document.getElementById("para").style.display = "block";
    }
  </script>

</body>
</html>
