<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const interval = setInterval(() => {
        console.log("Running...");
      }, 1000);
      setTimeout(() => {
        clearInterval(interval);
        console.log("Interval stopped after 5 seconds");
      }, 5000);
    </script>
  </body>
</html>
