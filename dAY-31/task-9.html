<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let counter = 0;

      const intervalId = setInterval(() => {
        counter++;
        console.log(counter);

        if (counter === 10) {
          clearInterval(intervalId);
          console.log("Counter stopped at 10");
        }
      }, 1000);
    </script>
  </body>
</html>
