<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Task-1</h1>
    <script>
      class Person {
        constructor(name, age) {
          this.name = name;
          this.age = age;
        }

        greet() {
          console.log(
            `Hi, my name is ${this.name} and I am ${this.age} years old.`,
          );
        }
      }
      const person1 = new Person("Balajui", 25);
      person1.greet();
    </script>
  </body>
</html>
