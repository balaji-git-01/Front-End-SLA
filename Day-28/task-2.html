    <script>
      class Student {
        constructor(name, marks) {
          this.name = name;
          this.marks = marks;
        }

        getGrade() {
          if (this.marks >= 90) {
            return "A";
          } else if (this.marks >= 75) {
            return "B";
          } else if (this.marks >= 50) {
            return "C";
          } else {
            return "Fail";
          }
        }
      }
      const student1 = new Student("Balaji", 92);
      const student2 = new Student("Raji", p8);

      console.log(`${student1.name} Grade: ${student1.getGrade()}`);
      console.log(`${student2.name} Grade: ${student2.getGrade()}`);
